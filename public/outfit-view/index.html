<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Outfit — the dress edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --fg: #1a1a1a;
    --muted: #8a8a86;
    --hairline: #e8e6e0;
    --max: 1200px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    padding: 48px 28px 96px;
    font-size: 13px;
    line-height: 1.5;
  }

  header {
    max-width: var(--max);
    margin: 0 auto 56px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
  }
  header .title {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1.1;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  header .note {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 13px;
    max-width: 56ch;
  }

  .grid {
    max-width: var(--max);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 40px 24px;
  }

  .card { display: flex; flex-direction: column; }
  .card .image {
    aspect-ratio: 4 / 5;
    background: #fff;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .card .image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .brand {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 6px;
  }
  .card .name {
    font-size: 13px;
    margin: 0 0 4px;
    line-height: 1.35;
  }
  .card .price {
    font-size: 13px;
    margin: 0;
    color: var(--muted);
  }
  .card .id {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    color: #c2c0bb;
    margin: 14px 0 0;
    word-break: break-all;
  }
  .card .missing {
    aspect-ratio: 4 / 5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    border: 1px dashed var(--hairline);
    background: transparent;
  }

  .empty, .error {
    max-width: 560px;
    margin: 120px auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty code, .error code {
    font-family: ui-monospace, monospace;
    background: #fff;
    padding: 3px 8px;
    font-size: 12px;
    border: 1px solid var(--hairline);
  }
  .empty .ex {
    margin-top: 28px;
    font-size: 11px;
  }

  footer {
    max-width: var(--max);
    margin: 80px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  @media (max-width: 480px) {
    body { padding: 32px 20px 64px; }
    header { margin-bottom: 40px; }
    header .title { font-size: 26px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; }
    .card .image { margin-bottom: 12px; }
  }
</style>
</head>
<body>

<header id="header" style="display:none">
  <h1 class="title" id="title">Outfit</h1>
  <p class="meta" id="meta"></p>
  <p class="note" id="note" style="display:none"></p>
</header>

<main id="grid" class="grid"></main>

<footer id="footer" style="display:none">the dress edit</footer>

<script>
(async function () {
  const grid = document.getElementById('grid');
  const headerEl = document.getElementById('header');
  const titleEl = document.getElementById('title');
  const metaEl = document.getElementById('meta');
  const noteEl = document.getElementById('note');
  const footerEl = document.getElementById('footer');

  const params = new URLSearchParams(window.location.search);
  const idsParam = params.get('ids');
  const title = params.get('title');
  const note = params.get('note');

  if (!idsParam) {
    grid.outerHTML = `
      <div class="empty">
        Pass product IDs in the URL to view an outfit.
        <div class="ex">
          <code>?ids=id1,id2,id3</code><br><br>
          Optional: <code>&title=Slate+Twill</code> · <code>&note=for+Miranda</code>
        </div>
      </div>`;
    return;
  }

  const ids = idsParam.split(',').map(s => s.trim()).filter(Boolean);

  headerEl.style.display = 'block';
  if (title) titleEl.textContent = decodeURIComponent(title.replace(/\+/g, ' '));
  if (note) {
    noteEl.textContent = decodeURIComponent(note.replace(/\+/g, ' '));
    noteEl.style.display = 'block';
  }
  metaEl.textContent = 'Loading…';

  let data;
  try {
    const res = await fetch('/outfit-lab/data.json');
    if (!res.ok) throw new Error('fetch failed');
    data = await res.json();
  } catch (e) {
    grid.innerHTML = '<div class="error">Could not load <code>/outfit-lab/data.json</code>.</div>';
    metaEl.textContent = '';
    return;
  }

  const byId = {};
  for (const bucket of data) {
    for (const p of bucket.products) byId[p.id] = p;
  }

  const foundCount = ids.filter(id => byId[id]).length;
  const word = ids.length === 1 ? 'piece' : 'pieces';
  metaEl.textContent = foundCount === ids.length
    ? `${ids.length} ${word}`
    : `${foundCount} of ${ids.length} ${word}`;

  grid.innerHTML = ids.map(id => {
    const p = byId[id];
    if (!p) {
      return `
        <div class="card">
          <div class="missing">Not found</div>
          <p class="id">${escapeHtml(id)}</p>
        </div>`;
    }
    const price = p.price != null ? `£${p.price}` : '';
    return `
      <div class="card">
        <div class="image">
          <img src="${escapeHtml(p.image)}"
               alt="${escapeHtml(p.brand)} ${escapeHtml(p.name)}"
               loading="lazy">
        </div>
        <p class="brand">${escapeHtml(p.brand)}</p>
        <p class="name">${escapeHtml(p.name)}</p>
        <p class="price">${price}</p>
        <p class="id">${escapeHtml(p.id)}</p>
      </div>`;
  }).join('');

  footerEl.style.display = 'block';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
})();
</script>

</body>
</html>
