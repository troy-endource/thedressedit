      display: flex;

      width: 100%;

      border-radius: var(--r-lg);
      border: 0.5px solid var(--c-border);
      overflow: hidden;

    .icon-btn { padding: 6px 10px; border-radius: var(--r-md); border: 0.5px solid var(--c-border-strong); background: var(--c-surface); cursor: pointer; }
    .row-scroll, .brand-strip { scrollbar-width: none; -ms-overflow-style: none; }
    .row-scroll::-webkit-scrollbar, .brand-strip::-webkit-scrollbar { display: none; }
    .brand-strip { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; border-bottom: 0.5px solid var(--c-border); -webkit-overflow-scrolling: touch; }
    .pill { padding: 6px 12px; border-radius: 999px; font-size: 11px; border: 0.5px solid var(--c-border); background: var(--c-surface); color: var(--c-text-2); white-space: nowrap; cursor: pointer; user-select: none; flex: 0 0 auto; }
    .pill.on { background: var(--c-text); color: var(--c-surface); border-color: var(--c-text); }
    .row { padding: 12px 0 14px; border-bottom: 0.5px solid var(--c-border); }
    .row:last-of-type { border-bottom: 0; }
    .row-head { display: flex; justify-content: space-between; padding: 0 16px 8px; align-items: center; }
    .cat-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; background: none; border: none; padding: 0; cursor: pointer; color: var(--c-text); font-family: inherit; }
    .row-meta { font-size: 11px; color: var(--c-text-3); }
    .row-scroll { display: flex; gap: 8px; padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .card { flex: 0 0 auto; width: 110px; scroll-snap-align: start; cursor: pointer; transition: transform 0.15s; }
    .card:active { transform: scale(0.97); }
    .tile { position: relative; width: 110px; height: 138px; background: var(--c-surface-2); border-radius: var(--r-md); border: 0.5px solid var(--c-border); overflow: hidden; }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .card.pinned { position: sticky; z-index: 2; }
    .card.pinned[data-pin="0"] { left: 16px; }
    .card.pinned[data-pin="1"] { left: 134px; }
    .card.pinned[data-pin="2"] { left: 252px; }
    .card.pinned .tile { box-shadow: 0 0 0 2px var(--c-text); border-color: transparent; }
    .pin-tag { position: absolute; top: 6px; left: 6px; background: var(--c-text); color: var(--c-surface); font-size: 9px; padding: 2px 6px; border-radius: 999px; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0; z-index: 3; }
    .card.pinned .pin-tag { opacity: 1; }
    .brand { font-size: 10px; color: var(--c-text-2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }
    .name { font-size: 11px; line-height: 1.3; height: 28px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
    .price { font-size: 11px; margin-top: 4px; }
    .price s { color: var(--c-text-3); margin-right: 4px; }
    .actions { padding: 14px 16px; display: flex; gap: 8px; border-top: 0.5px solid var(--c-border); background: var(--c-surface); }
    .btn { padding: 10px 14px; border-radius: var(--r-md); border: 0.5px solid var(--c-border-strong); background: var(--c-surface); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; color: var(--c-text); }
    .btn.primary { background: var(--c-text); color: var(--c-surface); border-color: var(--c-text); }
    .btn:hover { border-color: var(--c-text); }
    .footer-note { width: 100%; max-width: 380px; font-size: 10px; color: var(--c-text-3); text-align: center; margin-top: 8px; }
  </style>
</head>

const state = ROWS.map(() => ({ pins: [] }));

function fmtPrice(n) {
  return n.toLocaleString('en-GB', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2 });
}

function esc(s) {
  return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function similarity(product, pinnedProducts) {
  if (!pinnedProducts.length) return 0;
  let s = 0;
  for (const p of pinnedProducts) {
    if (product.brand === p.brand) s += 3;
    const maxPrice = Math.max(product.price, p.price, 1);
    s += 1 - Math.abs(product.price - p.price) / maxPrice;
  }
  return s;
}

function getOrdered(rowIdx) {
  const s = state[rowIdx];
  const products = ROWS[rowIdx].products;
  if (!s.pins.length) return products.map((_, i) => i);
  const pinned = s.pins.map(i => products[i]);
  const unpinned = products.map((_, i) => i).filter(i => !s.pins.includes(i));
  unpinned.sort((a, b) => similarity(products[b], pinned) - similarity(products[a], pinned));
  return [...s.pins, ...unpinned];
}

function renderRow(rowIdx) {
  const row = ROWS[rowIdx];
  const s = state[rowIdx];
  const ordered = getOrdered(rowIdx);
  const rowEl = document.querySelector('[data-row="' + rowIdx + '"]');
  const trackEl = rowEl.querySelector('.row-scroll');
  const metaEl = rowEl.querySelector('.row-meta');

  trackEl.innerHTML = ordered.map(pIdx => {
    const p = row.products[pIdx];
    const isPinned = s.pins.includes(pIdx);
    const pinPos = isPinned ? s.pins.indexOf(pIdx) : -1;
    const original = p.price + (p.discount || 0);
    const priceHtml = p.discount > 0
      ? '<s>£' + fmtPrice(original) + '</s>£' + fmtPrice(p.price)
      : '£' + fmtPrice(p.price);
    const imgTag = p.image
      ? '<img src="' + p.image + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '';
    return '<div class="card' + (isPinned ? ' pinned' : '') + '" data-pid="' + pIdx + '"' + (isPinned ? ' data-pin="' + pinPos + '"' : '') + '>' +
      '<div class="tile">' +
        imgTag +
        '<span class="pin-tag">Pinned</span>' +
      '</div>' +
      '<div class="brand">' + esc(p.brand) + '</div>' +
      '<div class="name">' + esc(p.name) + '</div>' +
      '<div class="price">' + priceHtml + '</div>' +
    '</div>';
  }).join('');

  metaEl.textContent = s.pins.length > 0
    ? 'Similar to your ' + s.pins.length + ' pin' + (s.pins.length > 1 ? 's' : '')
    : row.products.length + ' pieces';

  trackEl.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const pid = parseInt(card.dataset.pid);
      if (s.pins.includes(pid)) {
        s.pins = s.pins.filter(p => p !== pid);
      } else if (s.pins.length < 3) {
        s.pins.push(pid);
      } else {
        return;
      }
      renderRow(rowIdx);
      trackEl.scrollTo({ left: 0, behavior: 'smooth' });
    });
  });
}

function renderAll() {
  const wrap = document.getElementById('rows');
  wrap.innerHTML = ROWS.map((row, i) =>
    '<div class="row" data-row="' + i + '">' +
      '<div class="row-head">' +
        '<button class="cat-btn">' + row.label + ' <i class="ti ti-chevron-down" aria-hidden="true" style="font-size: 14px; color: var(--c-text-3);"></i></button>' +
        '<span class="row-meta"></span>' +
      '</div>' +
      '<div class="row-scroll"></div>' +
    '</div>'
  ).join('');
  ROWS.forEach((_, i) => renderRow(i));

  const brands = new Set();
  ROWS.forEach(row => row.products.forEach(p => brands.add(p.brand)));
  document.getElementById('brand-strip').innerHTML =
    [...brands].map(b => '<span class="pill on">' + esc(b) + '</span>').join('') +
    '<span class="pill"><i class="ti ti-plus" aria-hidden="true" style="font-size: 12px;"></i> Add</span>';
  document.querySelectorAll('.brand-strip .pill').forEach(pill => {
    pill.addEventListener('click', () => pill.classList.toggle('on'));
  });
}

document.getElementById('shuffle-btn').addEventListener('click', () => {
  state.forEach((s, i) => {
    if (s.pins.length > 0) return;
    s.pins = [Math.floor(Math.random() * ROWS[i].products.length)];
    renderRow(i);
    document.querySelector('[data-row="' + i + '"] .row-scroll').scrollTo({ left: 0, behavior: 'smooth' });
  });
});

renderAll();
</script>
