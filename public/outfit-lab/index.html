<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#faf9f5" />
  <title>Outfit Lab · The Dress Edit</title>
  <link rel="preconnect" href="https://cdn.endource.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
  <style>
    :root {
      --c-bg: #faf9f5;
      --c-surface: #ffffff;
      --c-surface-2: #f4f2ec;
      --c-text: #1a1a1a;
      --c-text-2: #6b6b6b;
      --c-text-3: #a0a0a0;
      --c-border: rgba(0,0,0,0.08);
      --c-border-strong: rgba(0,0,0,0.18);
      --r-md: 8px;
      --r-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .page-header { width: 100%; max-width: 380px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--c-text-3); display: flex; justify-content: space-between; }
    .frame { width: 100%; max-width: 380px; background: var(--c-surface); border-radius: var(--r-lg); border: 0.5px solid var(--c-border); overflow: hidden; }

    .app-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 0.5px solid var(--c-border); }
    .app-head .eyebrow { font-size: 10px; color: var(--c-text-3); letter-spacing: 1px; text-transform: uppercase; }
    .app-head h1 { font-size: 18px; font-weight: 500; margin: 2px 0 0; }
    .app-head .sub { font-size: 11px; color: var(--c-text-3); margin-top: 2px; max-width: 240px; line-height: 1.4; }
    .icon-btn { padding: 6px 10px; border-radius: var(--r-md); border: 0.5px solid var(--c-border-strong); background: var(--c-surface); cursor: pointer; }

    /* hide scrollbars on all horizontal strips */
    .hero-strip, .thumb-strip { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; }
    .hero-strip::-webkit-scrollbar, .thumb-strip::-webkit-scrollbar { display: none; }

    /* slot */
    .slot { border-bottom: 0.5px solid var(--c-border); }
    .slot:last-of-type { border-bottom: 0; }
    .slot-head { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
    .cat-control { position: relative; display: inline-flex; align-items: center; }
    .cat-select {
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background: transparent; border: 0; padding: 4px 22px 4px 0;
      font-size: 15px; font-weight: 500; font-family: inherit;
      color: var(--c-text); cursor: pointer;
    }
    .cat-select:focus { outline: none; }
    .cat-chevron { position: absolute; right: 2px; pointer-events: none; font-size: 14px; color: var(--c-text-3); }
    .remove-btn { background: none; border: 0; padding: 6px; cursor: pointer; color: var(--c-text-3); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .remove-btn:hover { color: var(--c-text); background: var(--c-surface-2); }
    .remove-btn i { font-size: 16px; }

    /* hero strip */
    .hero-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--c-surface-2); }
    .hero-item { flex: 0 0 100%; scroll-snap-align: start; width: 100%; aspect-ratio: 4 / 5; position: relative; background: var(--c-surface-2); }
    .hero-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-item .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--c-text-3); font-size: 32px; }

    /* hero pagination dot */
    .hero-meta { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.45); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 999px; letter-spacing: 0.3px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 2; }

    /* product info */
    .product-info { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .product-info .brand { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--c-text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-info .price { font-size: 14px; font-weight: 500; white-space: nowrap; }
    .product-info .price s { font-weight: 400; opacity: 0.6; margin-right: 6px; color: var(--c-text-2); }

    /* product name (subtle, under brand if there's space) */
    .product-name { padding: 0 16px 12px; font-size: 12px; color: var(--c-text-2); line-height: 1.4; }

    /* thumbnail strip */
    .thumb-strip { display: flex; gap: 6px; padding: 0 16px 16px; overflow-x: auto; }
    .thumb { flex: 0 0 auto; width: 54px; height: 68px; border-radius: 6px; background: var(--c-surface-2); overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; position: relative; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.active { border-color: var(--c-text); }
    .thumb-empty { padding: 20px 16px 24px; text-align: center; color: var(--c-text-3); font-size: 12px; }

    /* add to outfit */
    .add-area { padding: 14px 16px; border-top: 0.5px solid var(--c-border); background: var(--c-bg); }
    .add-btn { width: 100%; padding: 12px; border-radius: var(--r-md); border: 1px dashed var(--c-border-strong); background: transparent; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--c-text-2); font-family: inherit; }
    .add-btn:hover:not(:disabled) { color: var(--c-text); border-color: var(--c-text); }
    .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .add-menu { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .add-menu button { padding: 12px 10px; border-radius: var(--r-md); border: 0.5px solid var(--c-border-strong); background: var(--c-surface); font-size: 12px; font-family: inherit; cursor: pointer; color: var(--c-text); text-align: center; }
    .add-menu button:hover { border-color: var(--c-text); }

    /* actions */
    .actions { padding: 14px 16px; display: flex; gap: 8px; border-top: 0.5px solid var(--c-border); background: var(--c-surface); }
    .btn { padding: 10px 14px; border-radius: var(--r-md); border: 0.5px solid var(--c-border-strong); background: var(--c-surface); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; color: var(--c-text); }
    .btn.primary { background: var(--c-text); color: var(--c-surface); border-color: var(--c-text); }

    .footer-note { width: 100%; max-width: 380px; font-size: 10px; color: var(--c-text-3); text-align: center; margin-top: 8px; }
    .loading { padding: 40px 16px; text-align: center; color: var(--c-text-3); font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="page-header">
    <span>thedressedit</span>
    <span>outfit lab · v4</span>
  </div>
  <main class="frame">
    <header class="app-head">
      <div>
        <div class="eyebrow">endource menswear</div>
        <h1>Build an outfit</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
      <button class="icon-btn" aria-label="Settings"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i></button>
    </header>
    <div id="slots"><div class="loading">Loading products…</div></div>
    <div class="add-area">
      <button class="add-btn" id="add-btn"><i class="ti ti-plus" aria-hidden="true"></i> Add to outfit</button>
      <div class="add-menu" id="add-menu" hidden></div>
    </div>
    <div class="actions">
      <button class="btn" style="flex: 1;" id="shuffle-btn"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i> Shuffle</button>
      <button class="btn primary" style="flex: 1;"><i class="ti ti-bookmark" aria-hidden="true"></i> Save outfit</button>
    </div>
  </main>
  <div class="footer-note">Private prototype · please don't share publicly</div>

<script>
let DATA = [];
let slots = [];
let slotIdCounter = 0;

const SUBCATS = {
  outerwear: [
    { label: 'All', test: () => true },
    { label: 'Bomber', test: p => /bomber/i.test(p.name) },
    { label: 'Blazer', test: p => /blazer/i.test(p.name) },
    { label: 'Coat', test: p => /coat|parka|trench/i.test(p.name) },
    { label: 'Gilet', test: p => /gilet|vest|waistcoat/i.test(p.name) },
    { label: 'Denim', test: p => /denim/i.test(p.name) },
    { label: 'Leather', test: p => /leather/i.test(p.name) },
    { label: 'Suede', test: p => /suede/i.test(p.name) },
    { label: 'Padded', test: p => /padded|puffer|down|quilted/i.test(p.name) },
  ],
  shirt: [
    { label: 'All', test: () => true },
    { label: 'Short sleeve', test: p => /short[- ]sleeve|camp[- ]collar|cuban[- ]collar/i.test(p.name) },
    { label: 'Long sleeve', test: p => /long[- ]sleeve/i.test(p.name) },
    { label: 'Oxford', test: p => /oxford/i.test(p.name) },
    { label: 'Linen', test: p => /linen/i.test(p.name) },
    { label: 'Overshirt', test: p => /overshirt/i.test(p.name) },
    { label: 'Check', test: p => /check|plaid|gingham|tartan|tattersall|madras/i.test(p.name) },
    { label: 'Denim', test: p => /denim|chambray/i.test(p.name) },
  ],
  trousers: [
    { label: 'All', test: () => true },
    { label: 'Trousers', test: p => /(trouser|chino|pant)/i.test(p.name) && !/short|jogger|track|sweat/i.test(p.name) },
    { label: 'Shorts', test: p => /short/i.test(p.name) },
    { label: 'Jeans', test: p => /jeans?\b|denim/i.test(p.name) },
    { label: 'Joggers', test: p => /jogger|sweatpant|track[- ]?pant|tracksuit/i.test(p.name) },
    { label: 'Linen', test: p => /linen/i.test(p.name) },
    { label: 'Cargo', test: p => /cargo/i.test(p.name) },
  ],
  footwear: [
    { label: 'All', test: () => true },
    { label: 'Trainers', test: p => /trainer/i.test(p.name) },
    { label: 'Sneakers', test: p => /sneaker/i.test(p.name) },
    { label: 'Loafers', test: p => /loafer/i.test(p.name) },
    { label: 'Boots', test: p => /boot/i.test(p.name) },
    { label: 'Canvas', test: p => /canvas/i.test(p.name) },
    { label: 'Suede', test: p => /suede/i.test(p.name) },
  ],
};

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return [...(r || document).querySelectorAll(s)]; }
function esc(s) { return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPrice(n) { return n.toLocaleString('en-GB', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }); }
function getRow(key) { return DATA.find(r => r.key === key); }

function getFiltered(slot) {
  const row = getRow(slot.category);
  if (!row) return [];
  const subcats = SUBCATS[slot.category] || [{ label: 'All', test: () => true }];
  const subcat = subcats.find(sc => sc.label === slot.subcat) || subcats[0];
  return row.products.filter(p => subcat.test(p));
}

function renderSlot(slot) {
  const products = getFiltered(slot);
  if (slot.currentIdx >= products.length) slot.currentIdx = 0;
  const current = products[slot.currentIdx];

  // category select options grouped by row
  const optsHtml = DATA.map(row => {
    const subcats = SUBCATS[row.key] || [{ label: 'All' }];
    return '<optgroup label="' + esc(row.label) + '">' +
      subcats.map(sc => {
        const val = row.key + '::' + sc.label;
        const selected = slot.category === row.key && slot.subcat === sc.label ? ' selected' : '';
        const label = sc.label === 'All' ? 'All ' + row.label : sc.label;
        return '<option value="' + esc(val) + '"' + selected + '>' + esc(label) + '</option>';
      }).join('') +
    '</optgroup>';
  }).join('');

  // hero strip
  const heroHtml = products.length
    ? products.map(p =>
        '<div class="hero-item">' +
          '<span class="placeholder"><i class="ti ti-photo" aria-hidden="true"></i></span>' +
          (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '') +
        '</div>'
      ).join('')
    : '<div class="hero-item"><span class="placeholder">No products in this filter</span></div>';

  // thumbnails
  const thumbsHtml = products.length > 1
    ? '<div class="thumb-strip">' +
        products.map((p, i) =>
          '<div class="thumb' + (i === slot.currentIdx ? ' active' : '') + '" data-idx="' + i + '">' +
            (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '') +
          '</div>'
        ).join('') +
      '</div>'
    : '';

  // product info
  let infoHtml = '';
  if (current) {
    const original = current.price + (current.discount || 0);
    const priceHtml = current.discount > 0
      ? '<s>£' + fmtPrice(original) + '</s>£' + fmtPrice(current.price)
      : '£' + fmtPrice(current.price);
    infoHtml =
      '<div class="product-info">' +
        '<div class="brand">' + esc(current.brand) + '</div>' +
        '<div class="price">' + priceHtml + '</div>' +
      '</div>' +
      '<div class="product-name">' + esc(current.name) + '</div>';
  }

  // hero counter (e.g. "3 / 47")
  const counterHtml = products.length > 1
    ? '<div class="hero-meta"><span class="hero-counter">' + (slot.currentIdx + 1) + '</span> / ' + products.length + '</div>'
    : '';

  return '<div class="slot" data-slot-id="' + slot.id + '">' +
    '<div class="slot-head">' +
      '<div class="cat-control">' +
        '<select class="cat-select">' + optsHtml + '</select>' +
        '<i class="ti ti-chevron-down cat-chevron" aria-hidden="true"></i>' +
      '</div>' +
      '<button class="remove-btn" aria-label="Remove"><i class="ti ti-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<div style="position: relative;">' +
      counterHtml +
      '<div class="hero-strip" data-hero-strip>' + heroHtml + '</div>' +
    '</div>' +
    infoHtml +
    thumbsHtml +
  '</div>';
}

function wireSlotEvents(slot) {
  const slotEl = $('[data-slot-id="' + slot.id + '"]');
  if (!slotEl) return;

  // category select
  const select = $('.cat-select', slotEl);
  select.addEventListener('change', () => {
    const [cat, sub] = select.value.split('::');
    slot.category = cat;
    slot.subcat = sub;
    slot.currentIdx = 0;
    rerenderSlot(slot);
    renderAddMenu();
  });

  // remove button
  $('.remove-btn', slotEl).addEventListener('click', () => removeSlot(slot.id));

  // hero strip scroll detection
  const heroStrip = $('[data-hero-strip]', slotEl);
  let scrollTimer;
  heroStrip.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const w = heroStrip.clientWidth;
      if (!w) return;
      const newIdx = Math.round(heroStrip.scrollLeft / w);
      if (newIdx !== slot.currentIdx) {
        slot.currentIdx = newIdx;
        updateSlotInfo(slot);
      }
    }, 80);
  }, { passive: true });

  // thumbnail clicks
  $$('.thumb', slotEl).forEach(thumb => {
    thumb.addEventListener('click', () => {
      const idx = parseInt(thumb.dataset.idx, 10);
      if (idx === slot.currentIdx) return;
      slot.currentIdx = idx;
      heroStrip.scrollTo({ left: idx * heroStrip.clientWidth, behavior: 'smooth' });
      updateSlotInfo(slot);
    });
  });
}

function updateSlotInfo(slot) {
  const products = getFiltered(slot);
  const current = products[slot.currentIdx];
  if (!current) return;

  const slotEl = $('[data-slot-id="' + slot.id + '"]');
  if (!slotEl) return;

  const original = current.price + (current.discount || 0);
  const priceHtml = current.discount > 0
    ? '<s>£' + fmtPrice(original) + '</s>£' + fmtPrice(current.price)
    : '£' + fmtPrice(current.price);

  const brandEl = $('.brand', slotEl);
  const priceEl = $('.price', slotEl);
  const nameEl = $('.product-name', slotEl);
  if (brandEl) brandEl.textContent = current.brand;
  if (priceEl) priceEl.innerHTML = priceHtml;
  if (nameEl) nameEl.textContent = current.name;

  const counterEl = $('.hero-counter', slotEl);
  if (counterEl) counterEl.textContent = slot.currentIdx + 1;

  $$('.thumb', slotEl).forEach((t, i) => t.classList.toggle('active', i === slot.currentIdx));
  const activeThumb = $('.thumb.active', slotEl);
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function rerenderSlot(slot) {
  const oldEl = $('[data-slot-id="' + slot.id + '"]');
  if (!oldEl) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderSlot(slot);
  const newEl = tmp.firstElementChild;
  oldEl.replaceWith(newEl);
  wireSlotEvents(slot);
  // initialize hero position
  const heroStrip = $('[data-hero-strip]', newEl);
  if (heroStrip) {
    requestAnimationFrame(() => {
      heroStrip.scrollLeft = slot.currentIdx * heroStrip.clientWidth;
    });
  }
}

function appendSlot(slot) {
  const tmp = document.createElement('div');
  tmp.innerHTML = renderSlot(slot);
  $('#slots').appendChild(tmp.firstElementChild);
  wireSlotEvents(slot);
  const slotEl = $('[data-slot-id="' + slot.id + '"]');
  const heroStrip = $('[data-hero-strip]', slotEl);
  if (heroStrip) {
    requestAnimationFrame(() => {
      heroStrip.scrollLeft = slot.currentIdx * heroStrip.clientWidth;
    });
  }
  renderAddMenu();
  // scroll new slot into view
  setTimeout(() => slotEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function removeSlot(slotId) {
  slots = slots.filter(s => s.id !== slotId);
  $('[data-slot-id="' + slotId + '"]')?.remove();
  renderAddMenu();
}

function renderAddMenu() {
  const used = new Set(slots.map(s => s.category));
  const available = DATA.filter(r => !used.has(r.key));
  const menuEl = $('#add-menu');
  const btn = $('#add-btn');
  if (available.length === 0) {
    menuEl.innerHTML = '<div style="grid-column: span 2; padding: 10px; text-align: center; font-size: 11px; color: var(--c-text-3);">All categories added</div>';
    btn.disabled = true;
  } else {
    menuEl.innerHTML = available.map(r => '<button data-cat="' + esc(r.key) + '">' + esc(r.label) + '</button>').join('');
    btn.disabled = false;
    $$('#add-menu button').forEach(b => {
      b.addEventListener('click', () => {
        slotIdCounter++;
        const newSlot = { id: slotIdCounter, category: b.dataset.cat, subcat: 'All', currentIdx: 0 };
        slots.push(newSlot);
        $('#add-menu').hidden = true;
        appendSlot(newSlot);
      });
    });
  }
}

function renderAllSlots() {
  const wrap = $('#slots');
  wrap.innerHTML = slots.map(renderSlot).join('');
  slots.forEach(wireSlotEvents);
  slots.forEach(slot => {
    const slotEl = $('[data-slot-id="' + slot.id + '"]');
    if (!slotEl) return;
    const heroStrip = $('[data-hero-strip]', slotEl);
    if (heroStrip) {
      requestAnimationFrame(() => {
        heroStrip.scrollLeft = slot.currentIdx * heroStrip.clientWidth;
      });
    }
  });
}

$('#add-btn').addEventListener('click', () => {
  const menu = $('#add-menu');
  menu.hidden = !menu.hidden;
});

$('#shuffle-btn').addEventListener('click', () => {
  slots.forEach(slot => {
    const products = getFiltered(slot);
    if (!products.length) return;
    slot.currentIdx = Math.floor(Math.random() * products.length);
    const slotEl = $('[data-slot-id="' + slot.id + '"]');
    const heroStrip = $('[data-hero-strip]', slotEl);
    if (heroStrip) {
      heroStrip.scrollTo({ left: slot.currentIdx * heroStrip.clientWidth, behavior: 'smooth' });
    }
    updateSlotInfo(slot);
  });
});

fetch('data.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    DATA = data;
    slotIdCounter = 1;
    // default starting slot
    slots = [{ id: 1, category: 'shirt', subcat: 'All', currentIdx: 0 }];
    renderAllSlots();
    renderAddMenu();
    const total = DATA.reduce((s, r) => s + r.products.length, 0);
    $('#sub').textContent = total + ' products · swipe the hero or tap a thumbnail';
  })
  .catch(err => {
    $('#slots').innerHTML = '<div class="loading">Failed to load data.json: ' + esc(err.message) + '<br><br>Make sure data.json is uploaded to the same folder as index.html.</div>';
  });
</script>
</body>
</html>
