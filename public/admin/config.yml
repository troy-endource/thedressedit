backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # =============================================
  # ARTICLES
  # =============================================
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["publishDate", "title", "cluster"]
    view_filters:
      - label: "Wedding Guest"
        field: cluster
        pattern: "wedding-guest"
      - label: "Party Dresses"
        field: cluster
        pattern: "party-dresses"
      - label: "Maxi Dresses"
        field: cluster
        pattern: "maxi-dresses"
      - label: "Midi Dresses"
        field: cluster
        pattern: "midi-dresses"
      - label: "Mini Dresses"
        field: cluster
        pattern: "mini-dresses"
      - label: "Beach Dresses"
        field: cluster
        pattern: "beach-dresses"
      - label: "Wrap Dresses"
        field: cluster
        pattern: "wrap-dresses"
      - label: "Shirt Dresses"
        field: cluster
        pattern: "shirt-dresses"
      - label: "Floral Dresses"
        field: cluster
        pattern: "floral-dresses"
      - label: "Seen This Season"
        field: cluster
        pattern: "seen-this-season"
      - label: "New In"
        field: cluster
        pattern: "new-in"
      - label: "Sale"
        field: cluster
        pattern: "sale"
    fields:
      # --- Core fields ---
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The full article headline as it appears on the page"

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Override title for search results (max 70 chars). Leave blank to use Title."
        pattern: ['^.{0,70}$', "Keep under 70 characters"]

      - label: "Meta Description"
        name: "description"
        widget: "text"
        hint: "Appears in Google search results. Max 160 characters."
        pattern: ['^.{0,160}$', "Keep under 160 characters"]

      - label: "Subtitle"
        name: "subtitle"
        widget: "text"
        required: false
        hint: "Italicised intro line below the headline"

      - label: "Content Cluster"
        name: "cluster"
        widget: "select"
        options:
          - { label: "Wedding Guest", value: "wedding-guest" }
          - { label: "Party Dresses", value: "party-dresses" }
          - { label: "Maxi Dresses", value: "maxi-dresses" }
          - { label: "Midi Dresses", value: "midi-dresses" }
          - { label: "Mini Dresses", value: "mini-dresses" }
          - { label: "Beach Dresses", value: "beach-dresses" }
          - { label: "Wrap Dresses", value: "wrap-dresses" }
          - { label: "Shirt Dresses", value: "shirt-dresses" }
          - { label: "Floral Dresses", value: "floral-dresses" }
          - { label: "Seen This Season", value: "seen-this-season" }
          - { label: "New In", value: "new-in" }
          - { label: "Sale", value: "sale" }

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Eleanor Marsh"

      - label: "Author Role"
        name: "authorRole"
        widget: "string"
        default: "Senior Style Editor"
        required: false

      - label: "Featured Article"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Show on homepage hero. One per cluster only."

      # --- Images ---
      - label: "Hero Image"
        name: "image"
        widget: "image"
        hint: "Main article image. Recommended: 1600x900px"
        required: false

      - label: "Hero Image Alt Text"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Describe the image for accessibility and SEO"

      # --- Endource Integration ---
      - label: "Primary Endource Link"
        name: "endourceLink"
        widget: "string"
        required: false
        default: "https://www.endource.com/women/clothing/dresses"
        hint: "Main endource edit page this article links to"

      - label: "Endource CTA Text"
        name: "endourceCta"
        widget: "string"
        required: false
        default: "Shop the edit on endource"

      # --- Article Body ---
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Main article content. Use ## for section headings."

      # --- Product Sections ---
      - label: "Product Sections"
        name: "productSections"
        widget: "list"
        required: false
        hint: "Shoppable product grids inserted between article sections"
        collapsed: true
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"

          - label: "Insert After Heading"
            name: "insertAfter"
            widget: "string"
            hint: "The ## heading text this grid should appear after"

          - label: "Endource Link"
            name: "sectionEndourceLink"
            widget: "string"
            required: false

          - label: "Products"
            name: "products"
            widget: "list"
            max: 8
            min: 1
            fields:
              - label: "Brand"
                name: "brand"
                widget: "string"

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Price"
                name: "price"
                widget: "string"
                hint: "e.g. '£298'"

              - label: "Product Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Product URL"
                name: "url"
                widget: "string"
                hint: "endource product or edit page URL"

              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                options:
                  - { label: "None", value: "" }
                  - { label: "Editor's Pick", value: "editors-pick" }
                  - { label: "New In", value: "new-in" }
                  - { label: "Sale", value: "sale" }
# --- Endource Edit Grids ---
      - label: "Endource Edit Grids"
        name: "endourceEdits"
        widget: "list"
        required: false
        hint: "Pull 4 products automatically from an endource edit URL"
        collapsed: true
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
            required: false
            hint: "e.g. 'Minimal Wedding Guest Dresses'"

          - label: "Insert After Heading"
            name: "insertAfter"
            widget: "string"
            hint: "The ## heading text this grid should appear after"

          - label: "Endource Edit URL"
            name: "editUrl"
            widget: "string"
            hint: "Full endource edit page URL — products will be fetched automatically"

          - label: "Shop All Link"
            name: "endourceLink"
            widget: "string"
            required: false
            hint: "Optional override for the 'Shop all' link (defaults to editUrl)"
      # --- Related Articles ---
      - label: "Related Articles"
        name: "relatedArticles"
        widget: "list"
        required: false
        max: 3
        hint: "Cross-link to other articles (shown at bottom)"
        fields:
          - label: "Article Title"
            name: "title"
            widget: "string"

          - label: "Cluster"
            name: "cluster"
            widget: "string"

          - label: "URL Path"
            name: "url"
            widget: "string"
            hint: "e.g. '/articles/wedding-guest-dresses-2026/'"

  # =============================================
  # SITE SETTINGS
  # =============================================
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "src/content/settings/general.json"
        fields:
          - label: "Site Title"
            name: "siteTitle"
            widget: "string"
            default: "The Dress Edit"

          - label: "Tagline"
            name: "tagline"
            widget: "string"
            default: "Your UK Dress Style Guide"

          - label: "Announcement Bar Text"
            name: "announcementText"
            widget: "string"
            default: "the dress edit — your curated UK dress style guide"

          - label: "Announcement Bar Link"
            name: "announcementLink"
            widget: "string"
            default: "https://www.endource.com"

          - label: "Newsletter Heading"
            name: "newsletterHeading"
            widget: "string"
            default: "The Weekly Dress Edit"

          - label: "Newsletter Description"
            name: "newsletterDescription"
            widget: "string"
            default: "New arrivals, sale alerts, and styling ideas — every Thursday."

      - label: "Navigation"
        name: "navigation"
        file: "src/content/settings/navigation.json"
        fields:
          - label: "Nav Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

      - label: "Homepage Featured"
        name: "homepage"
        file: "src/content/settings/homepage.json"
        fields:
          - label: "Hero Article Slug"
            name: "heroSlug"
            widget: "string"
            hint: "Slug of the article to feature in the homepage hero"

          - label: "Featured Article Slugs"
            name: "featuredSlugs"
            widget: "list"
            hint: "Slugs of articles to show in the featured grid"
            field: { label: "Slug", name: "slug", widget: "string" }

      - label: "New In Page"
        name: "newin"
        file: "src/content/settings/newin.json"
        fields:
          - label: "Hero Image"
            name: "heroImage"
            widget: "image"
            required: false
            hint: "Featured image for the New In page"

          - label: "Hero Image Alt Text"
            name: "heroImageAlt"
            widget: "string"
            required: false

          - label: "Endource Edit URL"
            name: "editUrl"
            widget: "string"
            default: "https://www.endource.com/edit/new-in-this-week/Wm9ZRcnnfAABTqZ8?categories%5B%5D=3"
