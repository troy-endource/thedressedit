backend:
  name: git-gateway
  branch: main

# Change to false once you're happy with content
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"


slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # =============================================
  # ARTICLES
  # =============================================
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["publishDate", "title", "cluster"]
    view_filters:
      - label: "Wedding Guest"
        field: cluster
        pattern: "wedding-guest"
      - label: "Summer Dresses"
        field: cluster
        pattern: "summer-dresses"
      - label: "Work Dresses"
        field: cluster
        pattern: "work-dresses"
      - label: "Trends 2026"
        field: cluster
        pattern: "trends-2026"
      - label: "Body Shape"
        field: cluster
        pattern: "body-shape"
      - label: "Occasions"
        field: cluster
        pattern: "occasions"
      - label: "Budget & Sales"
        field: cluster
        pattern: "budget-sales"
    fields:
      # --- Core fields ---
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The full article headline as it appears on the page"

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Override title for search results (max 60 chars). Leave blank to use Title."
        pattern: ['^.{0,70}$', "Keep under 70 characters"]

      - label: "Meta Description"
        name: "description"
        widget: "text"
        hint: "Appears in Google search results. Max 155 characters."
        pattern: ['^.{0,160}$', "Keep under 160 characters"]

      - label: "Subtitle"
        name: "subtitle"
        widget: "text"
        required: false
        hint: "Italicised intro line below the headline"

      - label: "Content Cluster"
        name: "cluster"
        widget: "select"
        options:
          - { label: "Summer Dresses", value: "summer-dresses" }
          - { label: "Wedding Guest", value: "wedding-guest" }
          - { label: "Work Dresses", value: "work-dresses" }
          - { label: "Trends 2026", value: "trends-2026" }
          - { label: "Body Shape", value: "body-shape" }
          - { label: "Occasions", value: "occasions" }
          - { label: "Budget & Sales", value: "budget-sales" }
          - { label: "Fabric & Care", value: "fabric-care" }

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false

      - label: "Updated Date"
        name: "updatedDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        required: false
        hint: "Set this when you refresh the article content"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Eleanor Marsh"

      - label: "Author Role"
        name: "authorRole"
        widget: "string"
        default: "Senior Style Editor"
        required: false

      - label: "Read Time (minutes)"
        name: "readTime"
        widget: "number"
        min: 1
        max: 30
        default: 8

      - label: "Priority"
        name: "priority"
        widget: "select"
        options: ["HIGH", "MEDIUM", "LOW"]
        default: "MEDIUM"

      - label: "Featured Article"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Show on homepage hero and featured grid"

      # --- Images ---
      - label: "Hero Image"
        name: "heroImage"
        widget: "image"
        hint: "Main article image. Recommended: 1600x900px (16:9 ratio)"
        required: false

      - label: "Hero Image Alt Text"
        name: "heroImageAlt"
        widget: "string"
        required: false
        hint: "Describe the image for accessibility and SEO"

      - label: "Hero Image Credit"
        name: "heroImageCredit"
        widget: "string"
        required: false

      - label: "Thumbnail Image"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Used in article cards on homepage. Recommended: 800x600px (4:3 ratio)"

      # --- Endource Integration ---
      - label: "Primary Endource Link"
        name: "endourceLink"
        widget: "string"
        default: "https://www.endource.com/women/clothing/dresses"
        hint: "Main Endource edit page this article links to"

      - label: "Endource CTA Text"
        name: "endourceCta"
        widget: "string"
        default: "Shop on Endource"
        hint: "Button text for the main Endource call-to-action"

      # --- Article Body ---
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "The main article content. Use ## for section headings, ### for sub-headings."

      # --- Product Sections ---
      - label: "Product Sections"
        name: "productSections"
        widget: "list"
        required: false
        hint: "Add shoppable product grids that appear between article sections"
        collapsed: true
        fields:
          - label: "Section Title"
            name: "sectionTitle"
            widget: "string"
            hint: "e.g. 'Summer Wedding Guest Dresses'"

          - label: "Insert After Heading"
            name: "insertAfter"
            widget: "string"
            hint: "The ## heading text this product grid should appear after"

          - label: "Endource Link for Section"
            name: "sectionEndourceLink"
            widget: "string"
            required: false
            hint: "Specific Endource edit page for this section's 'Shop all' link"

          - label: "Products"
            name: "products"
            widget: "list"
            max: 8
            min: 1
            fields:
              - label: "Brand"
                name: "brand"
                widget: "string"

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Price"
                name: "price"
                widget: "string"
                hint: "e.g. '£298' or '£148 (was £228)'"

              - label: "Retailer"
                name: "retailer"
                widget: "string"
                hint: "e.g. 'Net-A-Porter', 'COS', 'John Lewis'"

              - label: "Product Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Product photo. Recommended: 600x800px (3:4 ratio)"

              - label: "Product URL"
                name: "url"
                widget: "string"
                hint: "Endource product or edit page URL"

              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                options:
                  - { label: "None", value: "" }
                  - { label: "Editor's Pick", value: "editors-pick" }
                  - { label: "Best Value", value: "best-value" }
                  - { label: "New In", value: "new-in" }
                  - { label: "Sale", value: "sale" }

      # --- Stylist Tips ---
      - label: "Stylist Tips"
        name: "stylistTips"
        widget: "list"
        required: false
        hint: "Green callout boxes with expert advice"
        collapsed: true
        fields:
          - label: "Tip Title"
            name: "title"
            widget: "string"
            default: "Stylist's Tip"

          - label: "Tip Text"
            name: "text"
            widget: "text"

          - label: "Insert After Heading"
            name: "insertAfter"
            widget: "string"
            hint: "The ## heading text this tip should appear after"

      # --- Related Articles ---
      - label: "Related Articles"
        name: "relatedArticles"
        widget: "list"
        required: false
        max: 3
        hint: "Cross-link to other articles (shown at bottom)"
        fields:
          - label: "Article Title"
            name: "title"
            widget: "string"

          - label: "Cluster"
            name: "cluster"
            widget: "string"

          - label: "URL Path"
            name: "url"
            widget: "string"
            hint: "e.g. '/wedding-guest/affordable-dresses/'"

  # =============================================
  # SITE SETTINGS
  # =============================================
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "src/content/settings/general.json"
        fields:
          - label: "Site Title"
            name: "siteTitle"
            widget: "string"
            default: "The Dress Edit"

          - label: "Tagline"
            name: "tagline"
            widget: "string"
            default: "Your UK Dress Style Guide"

          - label: "Announcement Bar Text"
            name: "announcementText"
            widget: "string"
            default: "Curated by the editors at Endource — Shop 50+ brands, one curated destination"

          - label: "Announcement Bar Link"
            name: "announcementLink"
            widget: "string"
            default: "https://www.endource.com"

          - label: "Newsletter Heading"
            name: "newsletterHeading"
            widget: "string"
            default: "The Weekly Dress Edit"

          - label: "Newsletter Description"
            name: "newsletterDescription"
            widget: "string"
            default: "New arrivals, sale alerts, and styling ideas — delivered to your inbox every Thursday."

      - label: "Navigation"
        name: "navigation"
        file: "src/content/settings/navigation.json"
        fields:
          - label: "Nav Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

      - label: "Homepage Featured"
        name: "homepage"
        file: "src/content/settings/homepage.json"
        fields:
          - label: "Hero Article Slug"
            name: "heroSlug"
            widget: "string"
            hint: "Slug of the article to feature as the hero"

          - label: "Featured Article Slugs"
            name: "featuredSlugs"
            widget: "list"
            hint: "Slugs of articles to show in the featured grid"
            field: { label: "Slug", name: "slug", widget: "string" }

      - label: "New In Page"
        name: "newin"
        file: "src/content/settings/newin.json"
        fields:
          - label: "Hero Image"
            name: "heroImage"
            widget: "image"
            hint: "Featured image for the New In page. Recommended: 1200x600px or similar landscape ratio."

          - label: "Hero Image Alt Text"
            name: "heroImageAlt"
            widget: "string"
            required: false
            hint: "Describe the image for accessibility"

          - label: "Endource Edit URL"
            name: "editUrl"
            widget: "string"
            default: "https://www.endource.com/edit/new-in-this-week/Wm9ZRcnnfAABTqZ8?categories%5B%5D=3"
            hint: "The endource edit page URL that feeds this page"
      
